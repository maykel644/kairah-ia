<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KAIRAH IA</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<style>
  :root {
    --verde: #00e676;
    --verde-oscuro: #00c853;
    --fondo: #041b0f;
    --fondo-panel: #0a2e18;
    --fondo-sidebar: #06220f;
    --borde: #0d3d20;
    --texto: #d9ffe6;
    --texto-tenue: #7fbf98;
    --error: #ff6b6b;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Courier New', monospace;
    background: var(--fondo);
    color: var(--texto);
    height: 100vh;
    display: flex;
    overflow: hidden;
  }

  /* SIDEBAR */
  #sidebar {
    width: 240px;
    min-width: 240px;
    background: var(--fondo-sidebar);
    border-right: 1px solid var(--borde);
    display: flex;
    flex-direction: column;
    transition: margin-left 0.2s ease;
  }

  #sidebar.oculto {
    margin-left: -240px;
  }

  .sidebar-header {
    padding: 14px;
    border-bottom: 1px solid var(--borde);
  }

  button.nuevo-chat {
    width: 100%;
    background: var(--verde);
    color: #012409;
    border: none;
    border-radius: 8px;
    padding: 10px;
    font-weight: bold;
    cursor: pointer;
    font-family: inherit;
  }

  #lista-chats {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }

  .item-chat {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 10px;
    border-radius: 6px;
    cursor: pointer;
    margin-bottom: 4px;
    font-size: 13px;
    color: var(--texto-tenue);
    gap: 6px;
  }

  .item-chat:hover {
    background: var(--fondo-panel);
  }

  .item-chat.activo {
    background: var(--fondo-panel);
    color: var(--verde);
    border: 1px solid var(--borde);
  }

  .item-chat .titulo-chat {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .item-chat .borrar-chat {
    background: none;
    border: none;
    color: var(--error);
    cursor: pointer;
    font-size: 14px;
    padding: 2px 6px;
    display: none;
  }

  .item-chat:hover .borrar-chat {
    display: block;
  }

  /* MAIN */
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    border-bottom: 1px solid var(--borde);
    background: var(--fondo-panel);
    gap: 10px;
  }

  .header-izquierda {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  button.toggle-sidebar {
    background: transparent;
    border: 1px solid var(--borde);
    color: var(--verde);
    border-radius: 6px;
    padding: 8px 10px;
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
  }

  .titulo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: bold;
    letter-spacing: 2px;
    color: var(--verde);
  }

  .punto {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--verde);
    box-shadow: 0 0 8px var(--verde);
  }

  .header-derecha {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  select {
    background: var(--fondo);
    color: var(--texto);
    border: 1px solid var(--borde);
    border-radius: 6px;
    padding: 6px 10px;
    font-family: inherit;
  }

  button.reiniciar {
    background: transparent;
    color: var(--error);
    border: 1px solid var(--error);
    border-radius: 6px;
    padding: 6px 10px;
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
  }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .mensaje {
    max-width: 82%;
    padding: 10px 14px;
    border-radius: 10px;
    line-height: 1.5;
    position: relative;
  }

  .mensaje-texto {
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .mensaje.usuario {
    align-self: flex-end;
    background: var(--verde-oscuro);
    color: #012409;
    font-weight: 600;
  }

  .mensaje.ia {
    align-self: flex-start;
    background: var(--fondo-panel);
    border: 1px solid var(--borde);
  }

  .etiqueta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11px;
    color: var(--texto-tenue);
    margin-bottom: 4px;
    letter-spacing: 1px;
  }

  .mensaje.usuario .etiqueta {
    color: #04511e;
  }

  .acciones-mensaje {
    display: flex;
    gap: 6px;
  }

  .acciones-mensaje button {
    background: transparent;
    border: none;
    color: inherit;
    opacity: 0.6;
    cursor: pointer;
    font-size: 12px;
    padding: 2px 4px;
  }

  .acciones-mensaje button:hover {
    opacity: 1;
  }

  .mensaje-texto pre {
    background: #01100a;
    border: 1px solid var(--borde);
    border-radius: 8px;
    padding: 12px;
    overflow-x: auto;
    margin: 8px 0;
  }

  .mensaje-texto code {
    font-family: 'Courier New', monospace;
    font-size: 13px;
  }

  .mensaje-texto :not(pre) > code {
    background: #01100a;
    padding: 2px 5px;
    border-radius: 4px;
  }

  .aviso-error {
    align-self: center;
    max-width: 90%;
    background: #2a0a0a;
    border: 1px solid var(--error);
    color: var(--error);
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 14px;
  }

  .aviso-error button {
    margin-top: 8px;
    background: transparent;
    border: 1px solid var(--error);
    color: var(--error);
    padding: 5px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
  }

  footer {
    padding: 14px 18px 20px;
    border-top: 1px solid var(--borde);
    background: var(--fondo-panel);
  }

  .fila-input {
    display: flex;
    gap: 10px;
  }

  textarea {
    flex: 1;
    resize: none;
    background: var(--fondo);
    color: var(--texto);
    border: 1px solid var(--borde);
    border-radius: 8px;
    padding: 12px;
    font-family: inherit;
    font-size: 15px;
    min-height: 46px;
    max-height: 140px;
  }

  textarea:focus {
    outline: none;
    border-color: var(--verde);
  }

  button.enviar {
    background: var(--verde);
    color: #012409;
    border: none;
    border-radius: 8px;
    padding: 0 22px;
    font-weight: bold;
    cursor: pointer;
    font-family: inherit;
  }

  button.enviar.detener {
    background: var(--error);
    color: #2a0a0a;
  }

  button.enviar:disabled {
    opacity: 0.5;
    cursor: default;
  }

  .hint {
    font-size: 11px;
    color: var(--texto-tenue);
    margin-top: 8px;
  }

  .badge-dev {
    background: var(--error);
    color: #2a0a0a;
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: bold;
    letter-spacing: 1px;
  }

  .video-trailer {
    width: 100%;
    max-width: 400px;
    aspect-ratio: 16 / 9;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--borde);
    margin-top: 6px;
  }

  .video-trailer iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }

  .editando-aviso {
    align-self: center;
    font-size: 11px;
    color: var(--verde);
    background: var(--fondo-panel);
    border: 1px solid var(--verde);
    padding: 4px 10px;
    border-radius: 6px;
  }

  @media (max-width: 640px) {
    #sidebar {
      position: fixed;
      z-index: 20;
      height: 100vh;
    }
  }
</style>
</head>
<body>

<div id="sidebar" class="oculto">
  <div class="sidebar-header">
    <button class="nuevo-chat" id="botonNuevoChat">+ Nuevo chat</button>
  </div>
  <div id="lista-chats"></div>
</div>

<div id="main">
  <header>
    <div class="header-izquierda">
      <button class="toggle-sidebar" id="botonToggleSidebar">☰</button>
      <div class="titulo">
        <span class="punto"></span>
        KAIRAH IA 💚
        <span class="badge-dev" id="badgeDev" style="display:none;">🕷️ PETER</span>
      </div>
    </div>
    <div class="header-derecha">
      <select id="modelo">
        <option value="llama-3.3-70b-versatile" selected>llama-3.3-70b</option>
        <option value="llama-3.1-8b-instant">llama-3.1-8b (rápido)</option>
        <option value="gemma2-9b-it">gemma2-9b</option>
      </select>
      <button class="reiniciar" id="botonReiniciar">🗑️ Borrar</button>
    </div>
  </header>

  <div id="chat"></div>

  <footer>
    <div class="fila-input">
      <textarea id="entrada" placeholder="Escribe tu mensaje..." rows="1"></textarea>
      <button class="enviar" id="botonEnviar">ENVIAR</button>
    </div>
    <div class="hint">Enter envía · Shift+Enter salto de línea · ✏️ en tus mensajes para editar y reenviar</div>
  </footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
const sidebar = document.getElementById('sidebar');
const botonToggleSidebar = document.getElementById('botonToggleSidebar');
const botonNuevoChat = document.getElementById('botonNuevoChat');
const listaChatsDiv = document.getElementById('lista-chats');

const chatDiv = document.getElementById('chat');
const entrada = document.getElementById('entrada');
const botonEnviar = document.getElementById('botonEnviar');
const modeloSelect = document.getElementById('modelo');
const botonReiniciar = document.getElementById('botonReiniciar');

const PROXY_URL = 'https://mayleladrian9--6112340c906411f19e1a1607ee4eb77e.web.val.run';
const MENSAJE_SISTEMA = { role: 'system', content: 'Eres KAIRAH IA, un asistente de IA amigable que responde en español.' };
const CLAVE_STORAGE = 'verdeia_conversaciones';

let estado = cargarEstado();
let controladorActual = null; // para el botón de Detener
let generando = false;
let modoPeter = false; // se activa/desactiva con la palabra secreta KAIRAHSECRET

function cargarEstado() {
  try {
    const guardado = localStorage.getItem(CLAVE_STORAGE);
    if (guardado) {
      const parseado = JSON.parse(guardado);
      if (parseado?.chats?.length > 0) return parseado;
    }
  } catch (e) {
    console.warn('No se pudo cargar el estado:', e);
  }
  const primerChat = crearChatNuevo();
  return { chats: [primerChat], chatActivoId: primerChat.id };
}

function guardarEstado() {
  try {
    localStorage.setItem(CLAVE_STORAGE, JSON.stringify(estado));
  } catch (e) {
    console.warn('No se pudo guardar el estado:', e);
  }
}

function crearChatNuevo() {
  return {
    id: 'chat_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
    titulo: 'Nuevo chat',
    historial: [MENSAJE_SISTEMA]
  };
}

function getChatActivo() {
  return estado.chats.find(c => c.id === estado.chatActivoId) || estado.chats[0];
}

function renderizarSidebar() {
  listaChatsDiv.innerHTML = '';
  const chatsOrdenados = [...estado.chats].reverse();

  for (const chat of chatsOrdenados) {
    const item = document.createElement('div');
    item.className = 'item-chat' + (chat.id === estado.chatActivoId ? ' activo' : '');

    const titulo = document.createElement('div');
    titulo.className = 'titulo-chat';
    titulo.textContent = chat.titulo;

    const borrar = document.createElement('button');
    borrar.className = 'borrar-chat';
    borrar.textContent = '✕';
    borrar.addEventListener('click', (e) => {
      e.stopPropagation();
      borrarChat(chat.id);
    });

    item.appendChild(titulo);
    item.appendChild(borrar);

    item.addEventListener('click', () => {
      estado.chatActivoId = chat.id;
      guardarEstado();
      renderizarSidebar();
      renderizarChatActivo();
      sidebar.classList.add('oculto'); // cierra el sidebar al elegir un chat
    });

    listaChatsDiv.appendChild(item);
  }
}

function borrarChat(id) {
  const confirmado = confirm('¿Borrar esta conversación?');
  if (!confirmado) return;

  estado.chats = estado.chats.filter(c => c.id !== id);

  if (estado.chats.length === 0) {
    const nuevo = crearChatNuevo();
    estado.chats.push(nuevo);
  }

  if (estado.chatActivoId === id) {
    estado.chatActivoId = estado.chats[estado.chats.length - 1].id;
  }

  guardarEstado();
  renderizarSidebar();
  renderizarChatActivo();
}

// Convierte texto con ```codigo``` en bloques <pre><code> con resaltado
function formatearTexto(texto) {
  const partes = texto.split(/```(\w*)\n?([\s\S]*?)```/g);
  let html = '';

  for (let i = 0; i < partes.length; i++) {
    if (i % 3 === 0) {
      html += escaparHtml(partes[i]);
    } else if (i % 3 === 1) {
      const lenguaje = partes[i];
      const codigo = partes[i + 1] || '';
      const claseLenguaje = lenguaje ? ' class="language-' + lenguaje + '"' : '';
      html += '<pre><code' + claseLenguaje + '>' + escaparHtml(codigo) + '</code></pre>';
      i++;
    }
  }

  return html;
}

function escaparHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function renderizarChatActivo() {
  chatDiv.innerHTML = '';
  const chat = getChatActivo();

  chat.historial.forEach((msg, indice) => {
    if (msg.role === 'user') {
      agregarMensajeVisual(msg.content, 'usuario', false, indice);
    } else if (msg.role === 'assistant') {
      agregarMensajeVisual(msg.content, 'ia', false, indice);
    }
  });
}

function agregarMensajeVisual(texto, tipo, hacerScroll = true, indiceHistorial = null) {
  const div = document.createElement('div');
  div.className = 'mensaje ' + tipo;

  const etiqueta = document.createElement('div');
  etiqueta.className = 'etiqueta';

  const nombreSpan = document.createElement('span');
  nombreSpan.textContent = tipo === 'usuario' ? 'TÚ' : 'KAIRAH IA';
  etiqueta.appendChild(nombreSpan);

  const acciones = document.createElement('div');
  acciones.className = 'acciones-mensaje';

  // Botón copiar (para ambos tipos)
  const btnCopiar = document.createElement('button');
  btnCopiar.textContent = '📋';
  btnCopiar.title = 'Copiar';
  btnCopiar.addEventListener('click', () => {
    navigator.clipboard.writeText(texto).catch(() => {});
    btnCopiar.textContent = '✅';
    setTimeout(() => { btnCopiar.textContent = '📋'; }, 1200);
  });
  acciones.appendChild(btnCopiar);

  // Botón editar (solo en mensajes de usuario)
  if (tipo === 'usuario' && indiceHistorial !== null) {
    const btnEditar = document.createElement('button');
    btnEditar.textContent = '✏️';
    btnEditar.title = 'Editar y reenviar';
    btnEditar.addEventListener('click', () => {
      editarMensaje(indiceHistorial, texto);
    });
    acciones.appendChild(btnEditar);
  }

  etiqueta.appendChild(acciones);

  const contenido = document.createElement('div');
  contenido.className = 'mensaje-texto';
  contenido.innerHTML = formatearTexto(texto);

  div.appendChild(etiqueta);
  div.appendChild(contenido);
  chatDiv.appendChild(div);

  if (window.hljs) {
    contenido.querySelectorAll('pre code').forEach(bloque => hljs.highlightElement(bloque));
  }

  if (hacerScroll) chatDiv.scrollTop = chatDiv.scrollHeight;

  return div;
}

function editarMensaje(indice, textoOriginal) {
  const chat = getChatActivo();

  // Corta el historial hasta justo antes de ese mensaje (lo borra a él y todo lo que sigue)
  chat.historial = chat.historial.slice(0, indice);
  guardarEstado();

  entrada.value = textoOriginal;
  entrada.style.height = 'auto';
  entrada.style.height = Math.min(entrada.scrollHeight, 140) + 'px';
  entrada.focus();

  renderizarChatActivo();
}

function mostrarError(mensaje, ultimoTexto) {
  const div = document.createElement('div');
  div.className = 'aviso-error';
  div.innerHTML = `⚠️ ${mensaje}<br><button>Reintentar último mensaje</button>`;
  div.querySelector('button').addEventListener('click', () => {
    div.remove();
    enviarMensaje(ultimoTexto, true);
  });
  chatDiv.appendChild(div);
  chatDiv.scrollTop = chatDiv.scrollHeight;
}

function actualizarBotonEnviar() {
  if (generando) {
    botonEnviar.textContent = '⏹ DETENER';
    botonEnviar.classList.add('detener');
    botonEnviar.disabled = false;
  } else {
    botonEnviar.textContent = 'ENVIAR';
    botonEnviar.classList.remove('detener');
    botonEnviar.disabled = false;
  }
}

async function enviarMensaje(textoForzado, esReintento) {
  if (generando) {
    // El botón está en modo "Detener"
    if (controladorActual) controladorActual.abort();
    return;
  }

  const texto = textoForzado !== undefined ? textoForzado : entrada.value.trim();
  if (!texto) return;

  // Detecta si piden ver el tráiler de Peter Parker / Spider-Man
  const textoLower = texto.toLowerCase();
  const pideTrailer = textoLower.includes('tráiler') || textoLower.includes('trailer');
  const mencionaPersonaje = textoLower.includes('peter parker') || textoLower.includes('spiderman') || textoLower.includes('spider-man') || textoLower.includes('spider man') || textoLower.includes('new day') || textoLower.includes('nuevo día') || textoLower.includes('nueva pelicula') || textoLower.includes('nueva película');

  if (pideTrailer && mencionaPersonaje) {
    entrada.value = '';
    entrada.style.height = 'auto';

    agregarMensajeVisual(texto, 'usuario', true, null);

    const div = agregarMensajeVisual('🎬 ¡Aquí tienes! El tráiler oficial de Spider-Man: Brand New Day:', 'ia', true, null);
    const contenedorVideo = document.createElement('div');
    contenedorVideo.className = 'video-trailer';
    contenedorVideo.innerHTML = '<iframe src="https://www.youtube.com/embed/TFM19lZlDhQ" title="Tráiler Spider-Man Brand New Day" allowfullscreen loading="lazy"></iframe>';
    div.appendChild(contenedorVideo);
    chatDiv.scrollTop = chatDiv.scrollHeight;

    return;
  }

  // Palabra secreta: activa/desactiva el Modo Peter Parker sin llamar a la IA
  if (texto.toUpperCase() === 'KAIRAHSECRET') {
    entrada.value = '';
    entrada.style.height = 'auto';

    modoPeter = !modoPeter;
    document.getElementById('badgeDev').style.display = modoPeter ? 'inline-block' : 'none';

    agregarMensajeVisual(texto, 'usuario', true, null);
    agregarMensajeVisual(
      modoPeter
        ? '🕷️ ¡Modo Peter Parker activado! A partir de ahora voy a responder como si fuera Peter Parker / Spider-Man.'
        : '💚 Modo Peter Parker desactivado: vuelvo a ser KAIRAH IA normal.',
      'ia',
      true,
      null
    );
    return;
  }

  const chat = getChatActivo();

  if (!esReintento) {
    agregarMensajeVisual(texto, 'usuario', true, chat.historial.length);
    chat.historial.push({ role: 'user', content: texto });

    if (chat.titulo === 'Nuevo chat') {
      chat.titulo = texto.slice(0, 30) + (texto.length > 30 ? '...' : '');
    }

    guardarEstado();
    renderizarSidebar();
    entrada.value = '';
    entrada.style.height = 'auto';
  }

  generando = true;
  actualizarBotonEnviar();

  const divRespuesta = agregarMensajeVisual('...', 'ia');
  controladorActual = new AbortController();

  try {
    const mensajesParaEnviar = modoPeter
      ? [
          { role: 'system', content: 'A partir de ahora actúa como Peter Parker (Spider-Man): un joven algo nervioso, con humor sarcástico, referencias de ciencia y comentarios de superhéroe. Responde siempre en primera persona como si fueras él, manteniendo su personalidad, pero sigue ayudando normalmente con lo que te pidan.' },
          ...chat.historial
        ]
      : chat.historial;

    const respuesta = await fetch(PROXY_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: modeloSelect.value,
        messages: mensajesParaEnviar,
        max_tokens: 1024
      }),
      signal: controladorActual.signal
    });

    if (!respuesta.ok) {
      const errData = await respuesta.json().catch(() => ({}));
      throw new Error(errData?.error?.message || `Error HTTP ${respuesta.status}`);
    }

    const data = await respuesta.json();
    const textoRespuesta = data.choices?.[0]?.message?.content?.trim() || '(sin respuesta)';

    const contenidoDiv = divRespuesta.querySelector('.mensaje-texto');
    contenidoDiv.innerHTML = formatearTexto(textoRespuesta);
    if (window.hljs) {
      contenidoDiv.querySelectorAll('pre code').forEach(b => hljs.highlightElement(b));
    }

    chat.historial.push({ role: 'assistant', content: textoRespuesta });
    guardarEstado();

  } catch (err) {
    divRespuesta.remove();
    if (err.name === 'AbortError') {
      agregarMensajeVisual('(respuesta detenida)', 'ia', true);
    } else {
      mostrarError('Fallo de red: ' + err.message, texto);
    }
  } finally {
    generando = false;
    controladorActual = null;
    actualizarBotonEnviar();
  }
}

function reiniciarChatActivo() {
  const confirmado = confirm('¿Borrar los mensajes de este chat?');
  if (!confirmado) return;

  const chat = getChatActivo();
  chat.historial = [MENSAJE_SISTEMA];
  chat.titulo = 'Nuevo chat';
  guardarEstado();
  renderizarSidebar();
  renderizarChatActivo();
}

botonToggleSidebar.addEventListener('click', () => {
  sidebar.classList.toggle('oculto');
});

botonNuevoChat.addEventListener('click', () => {
  const nuevo = crearChatNuevo();
  estado.chats.push(nuevo);
  estado.chatActivoId = nuevo.id;
  guardarEstado();
  renderizarSidebar();
  renderizarChatActivo();
  sidebar.classList.add('oculto'); // cierra el sidebar al crear un chat nuevo
});

botonEnviar.addEventListener('click', () => enviarMensaje());
botonReiniciar.addEventListener('click', reiniciarChatActivo);

entrada.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    enviarMensaje();
  }
});

entrada.addEventListener('input', () => {
  entrada.style.height = 'auto';
  entrada.style.height = Math.min(entrada.scrollHeight, 140) + 'px';
});

renderizarSidebar();
renderizarChatActivo();
</script>

</body>
</html>
